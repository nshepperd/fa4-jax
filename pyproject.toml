[project]
name = "fa4-jax"
dynamic = ["version"]
description = "FlashAttention-4 (CuTeDSL) for JAX: fwd/bwd/jvp with flex-attention mask mods, via cutejax"
readme = "README.md"
# Our code is MIT; the vendored kernels keep their upstream licenses:
# flash-attention (src/fa4_jax/cute/) BSD-3-Clause, quack's helpers
# (src/fa4_jax/cute/quack/) Apache-2.0.
license = "MIT AND BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE", "LICENSE.flash-attention", "LICENSE.quack"]
authors = [{ name = "Emily Shepperd", email = "nshepperd@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.8.0",
    "jaxtyping",
    "cutejax>=0.1.5",
    "nvidia-cutlass-dsl>=4.8",
]

[project.urls]
Repository = "https://github.com/nshepperd/fa4-jax"

[project.optional-dependencies]
# GPU runtime: jax with CUDA plus the CuTe DSL CUDA runtime libraries. CPU-only
# installs (reference backend, unit tests) don't need either.
cu12 = ["jax[cuda12]"]
cu13 = ["jax[cuda13]", "nvidia-cutlass-dsl[cu13]>=4.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "cutejax[redis]",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/fa4_jax/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fa4_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
# jaxtyping shape-string annotations trip F722/F821/UP037. C408: dict(...) is
# deliberate kwargs-style in hypothesis strategies and tolerance tables.
ignore = ["F722", "F821", "UP037", "C408"]
# The vendored kernels keep upstream style.
exclude = ["src/fa4_jax/cute/*"]

[tool.ty.environment]
root = ["./src/"]
extra-paths = [
    ".venv/lib/python3.14/site-packages/nvidia_cutlass_dsl/dsl_packages", 
    "./tests" # import conftest
]